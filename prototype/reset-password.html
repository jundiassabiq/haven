<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Buat kata sandi baru | Haven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <script src="assets/js/layout.js" data-layout="public" data-active=""></script>

  <main id="main" class="auth">
    <div class="auth-media">
      <div class="media"><img src="assets/img/reaching-hands.jpg" alt="" width="1600" height="1067"></div>
    </div>
    <div class="auth-panel">
      <div class="auth-form">
        <h1 class="h2">Buat kata sandi baru</h1>
        <p>Untuk akun <span class="mono">ra***@demo.id</span>. Setelah disimpan, semua sesi lain akan dikeluarkan.</p>
        <form class="form-stack" novalidate data-demo data-success-show="done">
          <div class="field">
            <label class="label" for="pw">Kata sandi baru</label>
            <div class="input-group">
              <input class="input" type="password" id="pw" name="password" autocomplete="new-password" minlength="8" required data-msg="Buat kata sandi minimal 8 karakter.">
              <button class="reveal" type="button" data-reveal="pw" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg><span class="sr-only">Tampilkan</span></button>
            </div>
            <p class="hint">Minimal 8 karakter.</p>
          </div>
          <div class="field">
            <label class="label" for="pw2">Ulangi kata sandi baru</label>
            <input class="input" type="password" id="pw2" name="password_confirm" autocomplete="new-password" required data-match="pw" data-msg="Ketik ulang kata sandi barumu.">
          </div>
          <button class="btn btn-ink btn-lg btn-block" type="submit">Simpan kata sandi</button>
        </form>
        <div class="alert alert-success" id="done" hidden style="margin-top:32px" role="status">
          <svg class="icon" aria-hidden="true"><use href="#i-check-circle"/></svg>
          <div><strong>Kata sandi diperbarui.</strong>Silakan <a href="masuk.html">masuk</a> dengan kata sandi barumu.</div>
        </div>
        <div class="alert alert-danger" style="margin-top:24px">
          <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>
          <div><strong>Contoh status lain: tautan kedaluwarsa.</strong>Tautan ini sudah lebih dari 30 menit. <a href="lupa-password.html">Minta tautan baru</a>.</div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
