<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Ubah layanan | Admin Haven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <script src="../assets/js/app.js" defer></script>
</head>
<body>
  <script src="../assets/js/layout.js" data-layout="app" data-role="admin" data-active="layanan"></script>
  <div class="app-shell">
    <script>HavenLayout.sidebar()</script>
    <main id="main" class="app-main">
      <a class="back-link" href="layanan.html"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg> Semua layanan</a>
      <form novalidate data-demo data-success="Layanan disimpan.">
        <div class="app-page-head">
          <h1 class="app-title">UPTD PPA Kabupaten Banyumas</h1>
          <button class="btn btn-yellow btn-sm" type="submit">Simpan layanan</button>
        </div>
        <div class="grid-2">
          <div class="panel panel-body form-stack">
            <div class="field"><label class="label" for="n">Nama layanan</label><input class="input" id="n" required value="UPTD PPA Kabupaten Banyumas" data-msg="Tulis nama layanan."></div>
            <div class="field-row">
              <div class="field"><label class="label" for="j">Jenis</label><select class="select" id="j"><option>Hotline</option><option selected>UPTD PPA</option><option>Rumah sakit</option><option>Bantuan hukum</option><option>Kepolisian (Unit PPA)</option><option>Psikolog</option><option>Satgas kampus</option></select></div>
              <div class="field"><label class="label" for="h">Jam layanan</label><input class="input" id="h" value="Senin–Jumat"></div>
            </div>
            <div class="field-row">
              <div class="field"><label class="label" for="p">Provinsi</label><select class="select" id="p"><option selected>Jawa Tengah</option><option>DI Yogyakarta</option><option>Nasional</option></select></div>
              <div class="field"><label class="label" for="k">Kota/kabupaten</label><input class="input" id="k" value="Banyumas"></div>
            </div>
            <div class="field"><label class="label" for="a">Alamat <span class="opt">(opsional)</span></label><textarea class="textarea textarea-sm" id="a" placeholder="Isi setelah diverifikasi langsung ke layanan"></textarea></div>
            <div class="field-row">
              <div class="field"><label class="label" for="tel">Telepon</label><input class="input mono" id="tel" type="tel" placeholder="Belum diverifikasi"></div>
              <div class="field"><label class="label" for="wa">WhatsApp <span class="opt">(opsional)</span></label><input class="input mono" id="wa" type="tel"></div>
            </div>
            <div class="field"><label class="label" for="tg">Jenis bantuan</label><input class="input" id="tg" value="Pendampingan, Psikologis, Hukum"><p class="hint">Pisahkan dengan koma.</p></div>
          </div>
          <aside class="panel panel-body form-stack">
            <fieldset class="field">
              <legend class="label">Verifikasi</legend>
              <label class="check"><input type="checkbox" name="verified" id="ver"> <span>Kontak dan jam layanan sudah dicek langsung ke lembaga</span></label>
            </fieldset>
            <div class="field" data-show-when="verified=on"><label class="label" for="vd">Tanggal verifikasi</label><input class="input" id="vd" type="date" value="2026-11-20" data-cond-required></div>
            <div class="field" data-show-when="verified=on"><label class="label" for="vb">Cara verifikasi</label><input class="input" id="vb" placeholder="Contoh: telepon ke kantor, 20 Nov" data-cond-required data-msg="Catat cara verifikasinya."></div>
            <div class="alert alert-warn">
              <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
              <div>Nomor yang salah bisa membuat penyintas kehilangan kesempatan mendapat bantuan. Jangan tandai terverifikasi sebelum dicek.</div>
            </div>
          </aside>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
