<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Ubah artikel | Admin Haven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <script src="../assets/js/app.js" defer></script>
</head>
<body>
  <script src="../assets/js/layout.js" data-layout="app" data-role="admin" data-active="artikel"></script>
  <div class="app-shell">
    <script>HavenLayout.sidebar()</script>
    <main id="main" class="app-main">
      <a class="back-link" href="artikel.html"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg> Semua artikel</a>
      <form novalidate data-demo data-success="Artikel disimpan.">
        <div class="app-page-head">
          <h1 class="app-title">Ubah artikel</h1>
          <div class="row">
            <a class="btn btn-ghost btn-sm" href="../artikel.html"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg> Pratinjau</a>
            <button class="btn btn-yellow btn-sm" type="submit">Simpan</button>
          </div>
        </div>
        <div class="grid-2">
          <div class="panel panel-body form-stack">
            <div class="field"><label class="label" for="t">Judul</label><input class="input" id="t" required maxlength="120" value="Sembilan bentuk kekerasan seksual menurut UU TPKS" data-msg="Tulis judul artikel."></div>
            <div class="field"><label class="label" for="ex">Ringkasan</label><textarea class="textarea textarea-sm" id="ex" maxlength="200" required data-counter="ex-c">Mengenali bentuknya adalah langkah pertama untuk berkata "ini tidak benar".</textarea><span class="counter" id="ex-c"></span><p class="hint">Tampil di kartu artikel dan hasil pencarian.</p></div>
            <div class="field">
              <label class="label" for="body">Isi artikel</label>
              <p class="hint">Gunakan <span class="mono">## Judul bagian</span> untuk subjudul dan baris kosong untuk paragraf baru. HTML tidak diizinkan.</p>
              <textarea class="textarea" id="body" rows="16" required data-msg="Isi artikel tidak boleh kosong.">Pada 2022, Indonesia mengesahkan Undang-Undang Nomor 12 Tahun 2022 tentang Tindak Pidana Kekerasan Seksual…

## 1. Pelecehan seksual nonfisik
Ucapan, isyarat, tulisan, atau perbuatan bernuansa seksual…</textarea>
            </div>
            <div class="field"><label class="label" for="src">Sumber rujukan</label><textarea class="textarea textarea-sm" id="src" required data-msg="Setiap artikel wajib mencantumkan sumber rujukan.">UU No. 12 Tahun 2022 tentang TPKS, Pasal 4 ayat (1) | https://peraturan.bpk.go.id/
Komnas Perempuan | https://komnasperempuan.go.id/</textarea><p class="hint">Satu sumber per baris: <span class="mono">Judul | URL</span>.</p></div>
          </div>
          <aside class="stack">
            <div class="panel panel-body form-stack">
              <fieldset class="field">
                <legend class="label">Status</legend>
                <div class="stack-sm">
                  <label class="choice"><input type="radio" name="st" value="terbit" checked><span class="choice-body"><span class="choice-title">Terbit</span><span class="choice-desc">Terlihat di halaman publik</span></span></label>
                  <label class="choice"><input type="radio" name="st" value="draf"><span class="choice-body"><span class="choice-title">Draf</span><span class="choice-desc">Hanya terlihat oleh admin</span></span></label>
                </div>
              </fieldset>
              <div class="field"><label class="label" for="cat">Kategori</label><select class="select" id="cat"><option selected>Mengenali</option><option>Setelah kejadian</option><option>Hak korban</option><option>Mendampingi</option><option>Keamanan digital</option></select></div>
              <div class="field"><label class="label" for="slug">Alamat (slug)</label><input class="input mono" id="slug" value="sembilan-bentuk-kekerasan-seksual" pattern="[a-z0-9-]+" data-msg-pattern="Gunakan huruf kecil, angka, dan tanda hubung saja."></div>
              <div class="field"><label class="label" for="rt">Waktu baca (menit)</label><input class="input mono" id="rt" type="number" min="1" max="60" value="6"></div>
            </div>
            <div class="panel panel-body field">
              <span class="label" id="cv">Gambar sampul</span>
              <div class="media" style="aspect-ratio:3/2;border-radius:4px"><img src="../assets/img/reaching-hands.jpg" alt="Sampul saat ini" width="1600" height="1067"></div>
              <label class="dropzone" data-dropzone="cv-list" style="padding:20px">
                <input type="file" accept=".jpg,.jpeg,.png" aria-labelledby="cv">
                <strong>Ganti gambar</strong><span class="hint">JPG atau PNG, maksimal 5 MB</span>
              </label>
              <ul class="file-list" id="cv-list"></ul>
              <div class="field"><label class="label" for="alt">Teks alternatif</label><input class="input" id="alt" value="Dua tangan saling meraih di latar abu-abu"></div>
            </div>
          </aside>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
